[project]
name = "llm-pcg-game"
version = "0.1.0"
description = "LLM-driven open-world roguelike with hierarchical LOD generation"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"main.py" = ["E402"]
"scripts/*" = ["E402"]
